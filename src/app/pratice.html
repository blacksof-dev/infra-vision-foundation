<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table style="width:100%; max-width:600px; margin:auto; font-family:Arial, sans-serif; border-collapse:collapse;">
  <tr>
    <td style="background-color:#d12248; padding:20px; text-align:center;">
      <h2 style="color:#fff; margin:0;">Contact Form Submission</h2>
    </td>
  </tr>
  <tr>
    <td style="padding:20px; background-color:#F6F6F6;">
      <p><strong style="color:#5d6468;">Name:</strong> {{first_name}} {{last_name}}</p>
      <p><strong style="color:#5d6468;">Email:</strong> {{email}}</p>
      <p><strong style="color:#5d6468;">Contact Number:</strong> {{contact_number}}</p>
      <p><strong style="color:#5d6468;">I am a:</strong> {{identity}}</p>
      <p><strong style="color:#5d6468;">Interested in:</strong> {{interest}}</p>
      <p><strong style="color:#5d6468;">Message:</strong>{{message}}</p>
      <p><strong style="color:#5d6468;">File:</strong> {{file_upload}}</p>
      <p><strong style="color:#5d6468;">Additional Link:</strong> <a href="{{link}}" style="color:#5d6468;">{{link}}</a></p>
    </td>
  </tr>
  
</table>

</body>
</html>
